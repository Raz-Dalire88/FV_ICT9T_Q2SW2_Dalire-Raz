<h2>Contact Us</h2>


  <form action="#" method="POST">
    <div>
      <label for="fullname">Full Name</label><br>
      <input type="text" id="fullname" name="fullname" size="40" placeholder="Enter your full name" required>
    </div>
    <br>

    <div>
      <label for="email">Email Address</label><br>
      <input type="email" id="email" name="email" size="40" placeholder="Enter your email" required>
    </div>
    <br>

    <div>
      <label for="subject">Subject</label><br>
      <input type="text" id="subject" name="subject" size="40" placeholder="Enter subject" required>
    </div>
    <br>

    <div>
      <label for="message">Message</label><br>
      <textarea id="message" name="message" rows="5" cols="38" placeholder="Type your message here" required></textarea>
    </div>
    <br>

    <div>
      <button type="submit">Send Message</button>
    </div>
  </form>
